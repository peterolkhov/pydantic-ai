name: python55-pydantic-graph-native-before
on:
  workflow_dispatch:
  push:
    branches: [codex/diagnose-graph-broadcast-prefix]
permissions:
  contents: read
jobs:
  native-before:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_NO_CACHE: "1"
      LOGFIRE_SEND_TO_LOGFIRE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pydantic/pydantic-ai
          ref: 92300c2e09be5cc85c9597ca97f22d0ba9edbee1
          path: upstream
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: false
      - name: Verify unmodified native output and controls
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          cat > "$RUNNER_TEMP/native-before.py" <<'PY_FIXTURE'
          """Finite public graph API proof; run against the untouched pinned upstream checkout."""

          from __future__ import annotations

          import asyncio
          import json
          from pathlib import Path

          import pydantic_graph
          from pydantic_graph import GraphBuilder, StepContext
          from pydantic_graph.join import reduce_list_append


          async def run_case(case: str) -> dict[str, object]:
              state = {"shared_calls": 0}
              g = GraphBuilder(state_type=dict[str, int], input_type=int, output_type=list[tuple[str, int]])

              def shared(ctx: StepContext[dict[str, int], None, int]) -> int:
                  ctx.state["shared_calls"] += 1
                  return ctx.inputs + 1

              def add_ten(ctx: StepContext[dict[str, int], None, int]) -> int:
                  return ctx.inputs + 10

              def add_twenty(ctx: StepContext[dict[str, int], None, int]) -> int:
                  return ctx.inputs + 20

              @g.step
              async def left(ctx: StepContext[dict[str, int], None, int]) -> tuple[str, int]:
                  return ("left", ctx.inputs)

              @g.step
              async def right(ctx: StepContext[dict[str, int], None, int]) -> tuple[str, int]:
                  return ("right", ctx.inputs)

              collect = g.join(reduce_list_append, initial_factory=list[tuple[str, int]])
              edge = g.edge_from(g.start_node)
              if case == "plain_callback":
                  entry = edge.broadcast(lambda b: [b.to(left), b.to(right)])
              elif case == "prefix_to":
                  entry = edge.transform(shared).to(left, right)
              elif case == "prefix_callback":
                  entry = edge.transform(shared).broadcast(lambda b: [b.to(left), b.to(right)])
              elif case == "decision_prefix_to":
                  entry = edge.to(g.decision().branch(g.match(int).transform(shared).to(left, right)))
              elif case == "decision_prefix_callback":
                  entry = edge.to(
                      g.decision().branch(
                          g.match(int).transform(shared).broadcast(lambda b: [b.to(left), b.to(right)])
                      )
                  )
              elif case == "branch_transforms":
                  entry = edge.broadcast(lambda b: [b.transform(add_ten).to(left), b.transform(add_twenty).to(right)])
              elif case == "prefix_and_branch_transforms":
                  entry = edge.transform(shared).broadcast(
                      lambda b: [b.transform(add_ten).to(left), b.transform(add_twenty).to(right)]
                  )
              else:
                  raise AssertionError(case)
              g.add(entry, g.edge_from(left, right).to(collect), g.edge_from(collect).to(g.end_node))
              result = await g.build().run(state=state, inputs=10)
              return {"values": [list(x) for x in sorted(result)], "shared_calls": state["shared_calls"]}


          async def main() -> None:
              package = Path(pydantic_graph.__file__).resolve()
              expected_package = Path.cwd() / "pydantic_graph" / "pydantic_graph" / "__init__.py"
              assert package == expected_package.resolve(), (package, expected_package)
              cases = (
                  "plain_callback",
                  "prefix_to",
                  "prefix_callback",
                  "decision_prefix_to",
                  "decision_prefix_callback",
                  "branch_transforms",
                  "prefix_and_branch_transforms",
              )
              actual = {case: await run_case(case) for case in cases}
              def record(left: int, right: int, calls: int) -> dict[str, object]:
                  return {"values": [["left", left], ["right", right]], "shared_calls": calls}
              before = {
                  "plain_callback": record(10, 10, 0),
                  "prefix_to": record(11, 11, 1),
                  "prefix_callback": record(12, 12, 3),
                  "decision_prefix_to": record(11, 11, 1),
                  "decision_prefix_callback": record(12, 12, 3),
                  "branch_transforms": record(20, 30, 0),
                  "prefix_and_branch_transforms": record(22, 32, 3),
              }
              desired = dict(before)
              desired.update(
                  prefix_callback=record(11, 11, 1),
                  decision_prefix_callback=record(11, 11, 1),
                  prefix_and_branch_transforms=record(21, 31, 1),
              )
              print(json.dumps({"actual": actual, "desired": desired, "source": str(package)}, sort_keys=True), flush=True)
              assert actual == before, {"unexpected_native_outcome": actual, "expected_before": before}
              assert actual != desired
              print(json.dumps({"status": "native_before_wrong_output_confirmed", "cases": len(cases)}), flush=True)


          asyncio.run(main())
          PY_FIXTURE
          cat > "$RUNNER_TEMP/source_guard.py" <<'PY_GUARD'
          PIN='92300c2e09be5cc85c9597ca97f22d0ba9edbee1'
          TREE='e1ace1cf70e638b93ea9f2fcb8d8c2e8864ef6de'
          EXPECTED={'pydantic_graph/pydantic_graph/decision.py': 'be4145b8e246141962becb18e13adb9409e1f79d', 'pydantic_graph/pydantic_graph/graph_builder.py': '2f2cc14fbb0469f87ea14b3771c087716a94356d', 'pydantic_graph/pydantic_graph/paths.py': '4f918667fee07f4347bc8f9e8070ccdecdb65ae1', 'pydantic_graph/pyproject.toml': '7a8d8b350dbeaa15fef8efea98d6d37f65008660', 'pyproject.toml': '69510fddf436d522b834a4cf35bb3b4e7349dc75', 'uv.lock': '5786f3f297491fec3d37253c99afa0cd36a6fa7f'}
          FIXTURE='304b31eba881952162a33e71edb2f73e6f3f56729b6d4a8d0fada2a4ad8758c7'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(["git",*args])
          assert git("rev-parse","HEAD").decode().strip()==PIN
          assert git("rev-parse","HEAD^{tree}").decode().strip()==TREE
          assert git("write-tree").decode().strip()==TREE
          subprocess.run(["git","diff","--quiet","HEAD","--"],check=True)
          index=git("ls-files","--stage","-z")
          records=[]
          for entry in index.split(b"\0"):
              if not entry: continue
              meta,rawpath=entry.split(b"\t",1)
              mode,blob,stage=meta.split()
              assert stage==b"0"
              path=Path(os.fsdecode(rawpath))
              data=os.fsencode(os.readlink(path)) if mode==b"120000" else path.read_bytes()
              header=b"blob "+str(len(data)).encode()+b"\0"
              assert hashlib.sha1(header+data).hexdigest()==blob.decode(),str(path)
              records.append((rawpath.hex(),hashlib.sha256(data).hexdigest()))
          for path,sha in EXPECTED.items():
              assert git("rev-parse","HEAD:"+path).decode().strip()==sha
          assert hashlib.sha256(Path(os.environ["RUNNER_TEMP"],"native-before.py").read_bytes()).hexdigest()==FIXTURE
          state={"head":PIN,"tree":TREE,"index_sha256":hashlib.sha256(index).hexdigest(),"tracked_count":len(records),"tracked_content_sha256":hashlib.sha256(json.dumps(records,separators=(",",":")).encode()).hexdigest(),"fixture_sha256":FIXTURE}
          statefile=Path(os.environ["RUNNER_TEMP"],"source-before.json")
          if sys.argv[1]=="before": statefile.write_text(json.dumps(state,sort_keys=True))
          else: assert state==json.loads(statefile.read_text()),state
          print(json.dumps({"guard":sys.argv[1],**state},sort_keys=True),flush=True)
          PY_GUARD
          python "$RUNNER_TEMP/source_guard.py" before
          uv sync --frozen --package pydantic-graph --no-default-groups --python 3.12
          python "$RUNNER_TEMP/source_guard.py" after-install
          .venv/bin/python "$RUNNER_TEMP/native-before.py"
          python "$RUNNER_TEMP/source_guard.py" after-fixture
